<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARINAS MERCADO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:380px;
    padding:30px;
    border-radius:15px;

    box-shadow:0 5px 25px rgba(0,0,0,0.10);

    text-align:center;
}

h2{
    margin-top:0;
    margin-bottom:25px;
}


/* =====================================================
   INSTITUIÇÕES PIX
===================================================== */

.chaves{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.chave-card{

    width:100%;

    border:2px solid transparent;

    border-radius:10px;

    padding:16px;

    cursor:pointer;

    text-align:center;

    transition:0.2s;

    background:#f7f7f7;
}

.chave-card:hover{
    transform:translateY(-2px);
}


/* =====================================================
   MERCADO PAGO
===================================================== */

.mercado-pago{
    border-color:#00a8e8;
}

.mercado-pago:hover,
.mercado-pago.selecionado{

    background:#e6f8ff;

    border-color:#00a8e8;
}


/* =====================================================
   PICPAY
===================================================== */

.picpay{
    border-color:#21c25e;
}

.picpay:hover,
.picpay.selecionado{

    background:#e9fff0;

    border-color:#21c25e;
}


/* =====================================================
   NUBANK
===================================================== */

.nubank{
    border-color:#820ad1;
}

.nubank:hover,
.nubank.selecionado{

    background:#f5e8ff;

    border-color:#820ad1;
}


/* =====================================================
   NOME DO BANCO
===================================================== */

.banco{

    font-size:18px;

    font-weight:bold;

}


/* =====================================================
   INPUT
===================================================== */

input{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:1px solid #ccc;

    border-radius:7px;

    font-size:16px;

    outline:none;
}

input:focus{
    border-color:#3498db;
}


/* =====================================================
   BOTÃO
===================================================== */

button{

    margin-top:12px;

    padding:12px;

    width:100%;

    border:none;

    border-radius:7px;

    background:#2ecc71;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:0.2s;
}

button:hover{
    background:#27ae60;
}


/* =====================================================
   MENSAGEM DE SELEÇÃO
===================================================== */

.mensagem{

    margin-top:15px;

    font-size:14px;

    font-weight:bold;

    transition:0.2s;
}


/* =====================================================
   TELA DO PIX
===================================================== */

#telaPix{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:#ffffff;

    z-index:9999;

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;
}


/* =====================================================
   INFORMAÇÕES PIX
===================================================== */

.pixTitulo{

    font-size:22px;

    font-weight:bold;

    margin-bottom:10px;

    color:#222;
}

#pixBanco{

    font-size:18px;

    font-weight:bold;

    margin-bottom:5px;
}

#pixValor{

    font-size:34px;

    font-weight:bold;

    margin-bottom:25px;

    color:#222;
}


/* =====================================================
   QR CODE
===================================================== */

#qrcodeGrande{

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:
        0 5px 30px rgba(0,0,0,0.15);

    display:flex;

    justify-content:center;

    align-items:center;
}


/* =====================================================
   CHAVE PIX DISCRETA
===================================================== */

#pixChave{

    margin-top:12px;

    font-size:12px;

    color:#999;

    font-weight:normal;

    word-break:break-all;

    max-width:320px;
}


/* =====================================================
   INSTRUÇÃO
===================================================== */

.instrucao{

    margin-top:20px;

    font-size:16px;

    color:#555;
}


/* =====================================================
   TIMER
===================================================== */

.timer{

    width:320px;

    max-width:90%;

    margin-top:25px;
}

.timerTexto{

    font-size:14px;

    color:#555;

    margin-bottom:7px;
}

.timerBarra{

    width:100%;

    height:10px;

    background:#e5e5e5;

    border-radius:20px;

    overflow:hidden;
}

.timerProgresso{

    width:100%;

    height:100%;

    background:#2ecc71;

    border-radius:20px;

    transition:width 1s linear;
}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

.btnFechar{

    width:200px;

    margin-top:20px;

    background:#777;
}

.btnFechar:hover{
    background:#555;
}


/* =====================================================
   CORES
===================================================== */

.mercadoTexto{
    color:#00a8e8;
}

.picpayTexto{
    color:#21c25e;
}

.nubankTexto{
    color:#820ad1;
}


/* =====================================================
   RESPONSIVIDADE
===================================================== */

@media(max-width:500px){

    .container{
        width:92%;
        padding:20px;
    }

    #pixValor{
        font-size:28px;
    }

    #qrcodeGrande{
        padding:15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     TELA PRINCIPAL
===================================================== -->

<div class="container">

    <h2>🛍️ Marinas Mercado 🛒</h2>


    <!-- INSTITUIÇÕES -->

    <div class="chaves">


        <!-- MERCADO PAGO -->

        <div
            class="chave-card mercado-pago"
            onclick="selecionarChave(
                this,
                '12391057466',
                'Mercado Pago',
                'mercadoTexto'
            )"
        >

            <div class="banco">
                🔵 Mercado Pago
            </div>

        </div>


        <!-- PICPAY -->

        <div
            class="chave-card picpay"
            onclick="selecionarChave(
                this,
                'kaua.hilton@gmail.com',
                'PicPay',
                'picpayTexto'
            )"
        >

            <div class="banco">
                🟢 PicPay
            </div>

        </div>


        <!-- NUBANK -->

        <div
            class="chave-card nubank"
            onclick="selecionarChave(
                this,
                '06806550428',
                'Nubank',
                'nubankTexto'
            )"
        >

            <div class="banco">
                🟣 Nubank
            </div>

        </div>

    </div>


    <!-- VALOR -->

    <input
        id="valor"
        placeholder="Valor"
        inputmode="decimal"
        autocomplete="off"
    >


    <!-- BOTÃO -->

    <button onclick="gerarPix()">
        Gerar PIX
    </button>


    <!-- MENSAGEM -->

    <div
        class="mensagem"
        id="mensagem"
    >

        Selecione uma instituição

    </div>

</div>



<!-- =====================================================
     TELA DO QR CODE
===================================================== -->

<div id="telaPix">


    <div class="pixTitulo">

        Aponte a câmera para o QR Code

    </div>


    <div id="pixBanco">
        PIX
    </div>


    <div id="pixValor">
        R$ 0,00
    </div>


    <div id="qrcodeGrande"></div>


    <div id="pixChave"></div>


    <div class="instrucao">

        Escaneie o QR Code para realizar o pagamento

    </div>


    <!-- TIMER -->

    <div class="timer">

        <div
            class="timerTexto"
            id="timerTexto"
        >
            PIX disponível por 45s
        </div>


        <div class="timerBarra">

            <div
                class="timerProgresso"
                id="timerProgresso"
            ></div>

        </div>

    </div>


    <button
        class="btnFechar"
        onclick="resetarPix()"
    >

        Voltar

    </button>


</div>



<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let chaveSelecionada = "";

let bancoSelecionado = "";

let corBanco = "";

let tempoRestante = 45;

let timer = null;


/* =====================================================
   ENTER PARA GERAR PIX
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            const telaPix =
                document.getElementById(
                    "telaPix"
                );

            if(
                telaPix.style.display !== "flex"
            ){

                gerarPix();

            }

        }

    }
);


/* =====================================================
   SELECIONAR INSTITUIÇÃO
===================================================== */

function selecionarChave(
    elemento,
    chave,
    banco,
    cor
){

    /*
       Remove seleção anterior
    */

    document
        .querySelectorAll(".chave-card")
        .forEach(card => {

            card.classList.remove(
                "selecionado"
            );

        });


    /*
       Destaca instituição
    */

    elemento.classList.add(
        "selecionado"
    );


    /*
       Guarda informações
    */

    chaveSelecionada = chave;

    bancoSelecionado = banco;

    corBanco = cor;


    /*
       MENSAGEM AGORA FICA
       NA COR DO BANCO
    */

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.innerText =
        banco + " selecionado ✓";


    /*
       Remove classes de cores anteriores
    */

    mensagem.classList.remove(
        "mercadoTexto",
        "picpayTexto",
        "nubankTexto"
    );


    /*
       Adiciona a cor correspondente
    */

    mensagem.classList.add(
        cor
    );

}


/* =====================================================
   FORMATAÇÃO DO VALOR
===================================================== */

const valorInput =
    document.getElementById("valor");


valorInput.addEventListener(
    "input",
    function(){

        let numeros =
            valorInput.value
            .replace(/\D/g,"");


        if(
            numeros.length === 0
        ){

            valorInput.value = "";

            return;

        }


        let valor =
            (
                parseInt(numeros) /
                100
            ).toFixed(2);


        valor =
            valor.replace(
                ".",
                ","
            );


        valor =
            valor.replace(
                /\B(?=(\d{3})+(?!\d))/g,
                "."
            );


        valorInput.value =
            "R$ " + valor;

    }
);


/* =====================================================
   CAMPO PIX
===================================================== */

function campo(id, valor){

    let tamanho =
        valor.length
        .toString()
        .padStart(2,"0");

    return (
        id +
        tamanho +
        valor
    );

}


/* =====================================================
   CRC16
===================================================== */

function crc16(payload){

    let polinomio = 0x1021;

    let resultado = 0xFFFF;


    for(
        let i = 0;
        i < payload.length;
        i++
    ){

        resultado ^=
            payload.charCodeAt(i)
            << 8;


        for(
            let j = 0;
            j < 8;
            j++
        ){

            resultado =
                (resultado & 0x8000)

                ?

                (resultado << 1)
                ^ polinomio

                :

                resultado << 1;


            resultado &=
                0xFFFF;

        }

    }


    return resultado
        .toString(16)
        .toUpperCase()
        .padStart(4,"0");

}


/* =====================================================
   GERAR PIX
===================================================== */

function gerarPix(){


    if(!chaveSelecionada){

        alert(
            "Selecione uma instituição de pagamento."
        );

        return;

    }


    let valor =
        valorInput.value
        .replace("R$","")
        .replace(/\./g,"")
        .replace(",",".")
        .trim();


    if(
        !valor ||
        parseFloat(valor) <= 0
    ){

        alert(
            "Digite um valor válido."
        );

        valorInput.focus();

        return;

    }


    const nome =
        "MARINAS MERCADO";


    /*
       Montagem PIX
    */

    const chavePix =

        campo(
            "00",
            "BR.GOV.BCB.PIX"
        )

        +

        campo(
            "01",
            chaveSelecionada
        );


    let payload = "";


    payload += "000201";

    payload += campo(
        "26",
        chavePix
    );

    payload += "52040000";

    payload += "5303986";

    payload += campo(
        "54",
        valor
    );

    payload += "5802BR";

    payload += campo(
        "59",
        nome
    );

    payload += campo(
        "60",
        "***"
    );

    payload += "62070503***";

    payload += "6304";


    /*
       CRC
    */

    payload +=
        crc16(payload);


    /*
       Elementos
    */

    const telaPix =
        document.getElementById(
            "telaPix"
        );


    const banco =
        document.getElementById(
            "pixBanco"
        );


    const valorTela =
        document.getElementById(
            "pixValor"
        );


    const chaveTela =
        document.getElementById(
            "pixChave"
        );


    /*
       Banco
    */

    banco.innerText =
        "PIX • " +
        bancoSelecionado;


    banco.className =
        corBanco;


    /*
       Valor
    */

    valorTela.innerText =
        valorInput.value;


    /*
       Chave discreta
    */

    chaveTela.innerText =
        "Chave: " +
        chaveSelecionada;


    /*
       Limpa QR
    */

    document.getElementById(
        "qrcodeGrande"
    ).innerHTML = "";


    /*
       Gera QR
    */

    new QRCode(

        document.getElementById(
            "qrcodeGrande"
        ),

        {
            text:payload,
            width:300,
            height:300
        }

    );


    /*
       Mostra tela
    */

    telaPix.style.display =
        "flex";


    /*
       Timer
    */

    iniciarTimer();

}


/* =====================================================
   TIMER
===================================================== */

function iniciarTimer(){

    clearInterval(timer);

    tempoRestante = 45;


    const texto =
        document.getElementById(
            "timerTexto"
        );


    const progresso =
        document.getElementById(
            "timerProgresso"
        );


    progresso.style.width =
        "100%";


    texto.innerText =
        "PIX disponível por 45s";


    timer =
        setInterval(
            function(){

                tempoRestante--;


                texto.innerText =
                    "PIX disponível por " +
                    tempoRestante +
                    "s";


                progresso.style.width =
                    (
                        tempoRestante /
                        45 *
                        100
                    ) + "%";


                if(
                    tempoRestante <= 0
                ){

                    clearInterval(timer);

                    resetarPix();

                }

            },
            1000
        );

}


/* =====================================================
   RESETAR
===================================================== */

function resetarPix(){

    clearInterval(timer);


    /*
       Fecha tela
    */

    document.getElementById(
        "telaPix"
    ).style.display =
        "none";


    /*
       Limpa QR
    */

    document.getElementById(
        "qrcodeGrande"
    ).innerHTML = "";


    /*
       Limpa chave
    */

    document.getElementById(
        "pixChave"
    ).innerText = "";


    /*
       Limpa valor
    */

    document.getElementById(
        "valor"
    ).value = "";


    /*
       Remove seleção
    */

    document
        .querySelectorAll(".chave-card")
        .forEach(card => {

            card.classList.remove(
                "selecionado"
            );

        });


    /*
       Limpa variáveis
    */

    chaveSelecionada = "";

    bancoSelecionado = "";

    corBanco = "";


    /*
       Reseta mensagem
    */

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.innerText =
        "Selecione uma instituição";


    mensagem.classList.remove(
        "mercadoTexto",
        "picpayTexto",
        "nubankTexto"
    );


    /*
       Reseta timer
    */

    document.getElementById(
        "timerProgresso"
    ).style.width =
        "100%";


    document.getElementById(
        "timerTexto"
    ).innerText =
        "PIX disponível por 45s";

}

</script>

</body>

</html>
